<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic AI Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-sidebar: #171717;
            --bg-main: #212121;
            --bg-chatbox: #2f2f2f;
            --text-main: #ececec;
            --text-secondary: #8e8e8e;
            --border-color: #383838;
            --accent: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; position: relative; }
        .cosmic-bg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, #121212 0%, #000000 100%); overflow: hidden; }
        .cosmic-bg::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background-image: radial-gradient(white 1px, transparent 0), radial-gradient(white 1px, transparent 0); background-size: 50px 50px; background-position: 0 0, 25px 25px; opacity: .05; animation: rotateGalaxy 120s linear infinite; }
        @keyframes rotateGalaxy { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; }
        @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
        aside { width: 280px; min-width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 12px; z-index: 2; justify-content: space-between; }
        .new-chat-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; background: transparent; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; cursor: pointer; font-size: 14px; transition: background .2s; margin-bottom: 20px; }
        .new-chat-btn:hover, .model-item:hover { background: rgba(255,255,255,.05); }
        .models-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex-grow: 1; }
        .model-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--text-secondary); transition: all .2s; }
        .model-item:hover { color: var(--text-main); }
        .model-item.active { background: rgba(255,255,255,.1); color: var(--accent); font-weight: 500; }
        .model-item i { font-size: 14px; width: 18px; text-align: center; }
        .api-settings { border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 10px; }
        .api-settings label { font-size: 11px; color: var(--text-secondary); display: block; margin-bottom: 6px; }
        .api-settings input { width: 100%; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 4px; padding: 6px 10px; color: var(--text-main); font-size: 12px; outline: none; }
        main { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; position: relative; z-index: 2; }
        .chat-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-size: 14px; font-weight: 500; background: rgba(33,33,33,.8); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 24px; align-items: center; }
        .message-wrapper { width: 100%; max-width: 768px; display: flex; gap: 16px; font-size: 15px; line-height: 1.6; }
        .message-wrapper.user { justify-content: flex-end; }
        .message-bubble { padding: 12px 16px; border-radius: 12px; max-width: 80%; overflow-wrap: anywhere; }
        .user .message-bubble { background: var(--bg-chatbox); color: var(--text-main); border: 1px solid var(--border-color); }
        .assistant .message-bubble { background: transparent; color: var(--text-main); padding: 0; }
        .avatar { width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .assistant .avatar { background: #fff; color: #000; }
        .user .avatar { background: #5436da; color: #fff; order: 2; }
        .chat-input-area { padding: 20px; display: flex; justify-content: center; background: linear-gradient(to top, var(--bg-main) 80%, transparent); }
        .input-box { width: 100%; max-width: 768px; background: var(--bg-chatbox); border: 1px solid var(--border-color); border-radius: 12px; display: flex; align-items: flex-end; padding: 10px 14px; box-shadow: 0 4px 20px rgba(0,0,0,.3); }
        .input-box textarea { flex-grow: 1; min-width: 0; background: transparent; border: none; color: var(--text-main); font-size: 15px; resize: none; max-height: 200px; outline: none; padding-bottom: 4px; }
        .input-box button { background: #fff; color: #000; border: none; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity .2s; margin-left: 8px; flex-shrink: 0; }
        .input-box button:hover { opacity: .8; }
        @media (max-width: 650px) {
            aside { width: 190px; min-width: 190px; padding: 8px; }
            .chat-header { padding: 12px; }
            .chat-messages { padding: 14px 10px; }
            .chat-input-area { padding: 12px 8px; }
            .message-wrapper { gap: 8px; font-size: 14px; }
        }
        @media (max-width: 440px) {
            aside { width: 145px; min-width: 145px; }
            .model-item { padding: 9px 6px; gap: 7px; font-size: 12px; }
            .new-chat-btn { padding: 9px 6px; font-size: 12px; }
            .api-settings input { padding: 6px 4px; font-size: 10px; }
            .chat-header span:last-child { display: none; }
        }
    </style>
</head>
<body>
    <div class="cosmic-bg" id="cosmicBg"></div>
    <aside>
        <div>
            <button class="new-chat-btn" onclick="clearChat()"><i class="fa-solid fa-plus"></i> Новый чат</button>
            <div class="models-list" id="modelsList">
                <div class="model-item active" onclick="selectModel(this, 'ChatGPT')"><i class="fa-solid fa-robot"></i> ChatGPT</div>
                <div class="model-item" onclick="selectModel(this, 'Claude')"><i class="fa-solid fa-brain"></i> Claude</div>
                <div class="model-item" onclick="selectModel(this, 'Gemini')"><i class="fa-solid fa-wand-magic-sparkles"></i> Gemini</div>
                <div class="model-item" onclick="selectModel(this, 'Astra')"><i class="fa-solid fa-satellite"></i> Astra</div>
                <div class="model-item" onclick="selectModel(this, 'Multi-режим')"><i class="fa-solid fa-layer-group"></i> Multi-режим</div>
            </div>
        </div>
        <div>
            <div class="api-settings">
                <label for="apiKeyInput">API-ключ (опционально):</label>
                <input type="password" id="apiKeyInput" placeholder="Вставьте ключ..." autocomplete="off" onchange="saveApiKey()">
            </div>
            <div style="font-size:11px;color:var(--text-secondary);text-align:center;margin-top:10px;">Cosmic UI v2.5 (B&W Edition)</div>
        </div>
    </aside>
    <main>
        <div class="chat-header">
            <span id="currentModelTitle">ChatGPT</span>
            <span style="color:var(--text-secondary);font-size:12px;">Готов к работе</span>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message-wrapper assistant">
                <div class="avatar"><i class="fa-solid fa-meteor"></i></div>
                <div class="message-bubble">Привет! Я ваш космический интерфейс. Выберите модель слева и задайте свой вопрос.</div>
            </div>
        </div>
        <div class="chat-input-area">
            <div class="input-box">
                <textarea id="userInput" placeholder="Сообщение..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
                <button onclick="sendMessage()" aria-label="Отправить сообщение"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
        </div>
    </main>
    <script>
        const bg = document.getElementById('cosmicBg');
        for (let i = 0; i < 120; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.width = (Math.random() * 2 + 1) + 'px';
            star.style.height = star.style.width;
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            bg.appendChild(star);
        }
        let currentActiveModel = 'ChatGPT';
        window.addEventListener('load', () => {
            const savedKey = localStorage.getItem('cosmic_api_key');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
        });
        function saveApiKey() {
            localStorage.setItem('cosmic_api_key', document.getElementById('apiKeyInput').value.trim());
        }
        function selectModel(element, modelName) {
            document.querySelectorAll('.model-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            currentActiveModel = modelName;
            document.getElementById('currentModelTitle').innerText = modelName;
        }
        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function appendAssistantMessage(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper assistant';
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerHTML = '<i class="fa-solid fa-meteor"></i>';
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;
            wrapper.append(avatar, bubble);
            document.getElementById('chatMessages').appendChild(wrapper);
            return bubble;
        }
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            const messagesContainer = document.getElementById('chatMessages');
            const userMsg = document.createElement('div');
            userMsg.className = 'message-wrapper user';
            const userBubble = document.createElement('div');
            userBubble.className = 'message-bubble';
            userBubble.textContent = text;
            const userAvatar = document.createElement('div');
            userAvatar.className = 'avatar';
            userAvatar.innerHTML = '<i class="fa-solid fa-user"></i>';
            userMsg.append(userBubble, userAvatar);
            messagesContainer.appendChild(userMsg);
            input.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            const bubble = appendAssistantMessage('Думает (' + currentActiveModel + ')...');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            await new Promise(resolve => setTimeout(resolve, 800));
            bubble.textContent = apiKey
                ? '[' + currentActiveModel + ']: Интерфейс получил ваш запрос. Для реального ответа необходимо подключить API через защищённый сервер.'
                : '[' + currentActiveModel + ']: Это демонстрационный режим. Для настоящих ответов подключите API через сервер.';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        function clearChat() {
            const container = document.getElementById('chatMessages');
            container.replaceChildren();
            appendAssistantMessage('Чат очищен. Готов к новым запросам!');
        }
    </script>
</body>
</html>
